services:
  app:
    build: .
    image: adrianmedeirosdev/jwt-auth:dev
    ports:
      - 3000:3000
    networks:
      - authnet
    env_file:
      - .env.dev
    volumes:
      - .:/usr/app
    depends_on:
      - auth_db
    # Removed automatic migrations at container start so the server can boot
    # (run migrations separately in CI or manually) — this keeps `/docs` available
    command: sh -c "npm run dev"
    
  auth_db:
    image: postgres:latest
    ports:
      - 5432:5432
    env_file:
      - .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - authnet
networks:
  authnet:
volumes:
  postgres_data: